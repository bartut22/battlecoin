[project]
name = "battlecoin"
version = "0.1.0"
description = "Binary option style probability and pricing engine for market-data driven hackathon demos."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
battlecoin = "battlecoin.cli:main"
battlecoin-dashboard = "battlecoin.dashboard:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
